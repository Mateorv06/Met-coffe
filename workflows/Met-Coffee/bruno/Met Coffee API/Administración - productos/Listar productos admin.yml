info:
  name: Listar productos admin
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/admin/productos"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('El listado administrativo responde HTTP 200', () => expect(res.getStatus()).to.equal(200));
        test('El resultado es una lista JSON', () => expect(res.getBody()).to.be.an('array'));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
