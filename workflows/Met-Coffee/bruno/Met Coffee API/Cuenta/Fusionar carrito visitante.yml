info:
  name: Fusionar carrito visitante
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/cuenta/{{usuarioId}}/fusionar-carrito"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{clienteToken}}
  body:
    type: json
    data: |-
      {
        "usuarioId": "visitante",
        "items": []
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('La fusión del carrito responde HTTP 204', () => {
          expect(res.getStatus()).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
