info:
  name: Registrar usuario
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/cuenta/registro"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "nombreUsuario": "{{usuarioPrueba}}",
        "correo": "{{correoPrueba}}",
        "password": "{{passwordPrueba}}",
        "telefono": "3001234567"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Limpia variables de corridas anteriores y crea un usuario nuevo en cada corrida
        ['clienteToken', 'adminToken', 'usuarioId', 'productoId', 'direccionId', 'pedidoId', 'pedidoAdminId', 'usuarioDescartableId']
          .forEach((v) => bru.deleteVar(v));
        const sufijo = Date.now();
        bru.setVar('usuarioPrueba', 'cliente' + sufijo);
        bru.setVar('correoPrueba', 'cliente' + sufijo + '@test.local');
        bru.setVar('passwordPrueba', 'MetCoffee2026!');
    - type: after-response
      code: |-
        test('Registro creado con HTTP 201', () => expect(res.getStatus()).to.equal(201));
        const body = res.getBody() || {};
        test('El registro devuelve un ID y rol de cliente', () => {
          expect(body.id).to.be.a('string').and.not.empty;
          expect(body.rol).to.eql('CLIENTE');
        });
        if (res.getStatus() === 201) {
          bru.setVar('usuarioId', body.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
