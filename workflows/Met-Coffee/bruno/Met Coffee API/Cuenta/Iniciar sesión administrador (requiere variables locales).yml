info:
  name: Iniciar sesión administrador (requiere variables locales)
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/cuenta/login"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "correo": "{{adminCorreo}}",
        "password": "{{adminPassword}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.getBody() || {};
        test('Login administrativo correcto con HTTP 200', () => expect(res.getStatus()).to.equal(200));
        test('Se recibe un JWT de administrador', () => expect(body.token).to.be.a('string').and.not.empty);
        test('El usuario devuelto tiene rol ADMINISTRADOR', () => expect(body.usuario.rol).to.eql('ADMINISTRADOR'));
        if (res.getStatus() === 200 && body.token) {
          bru.setVar('adminToken', body.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
