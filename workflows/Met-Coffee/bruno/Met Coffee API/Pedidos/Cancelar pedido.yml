info:
  name: Cancelar pedido
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseUrl}}/api/pedidos/{{usuarioId}}/{{pedidoId}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: test('La cancelación responde HTTP 204', () => expect(res.getStatus()).to.equal(204));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
