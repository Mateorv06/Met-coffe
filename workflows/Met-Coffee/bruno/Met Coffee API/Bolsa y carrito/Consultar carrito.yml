info:
  name: Consultar carrito
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/carrito/{{usuarioId}}"
  headers:
    - name: Authorization
      value: Bearer {{clienteToken}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('Consultar carrito responde HTTP 200', () => expect(res.getStatus()).to.equal(200));
        test('El carrito pertenece al usuario de prueba', () => expect((res.getBody() || {}).usuarioId).to.eql(bru.getVar('usuarioId')));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
