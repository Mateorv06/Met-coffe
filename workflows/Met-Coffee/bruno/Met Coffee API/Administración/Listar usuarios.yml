info:
  name: Listar usuarios
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/api/admin/usuarios"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('Listar usuarios responde HTTP 200', () => expect(res.getStatus()).to.equal(200));
        test('El resultado es una lista JSON', () => expect(res.getBody()).to.be.an('array'));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
