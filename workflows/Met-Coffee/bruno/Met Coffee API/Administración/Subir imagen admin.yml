info:
  name: Subir imagen admin
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/api/admin/productos/{{productoId}}/imagen"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  body:
    type: multipart-form
    data:
      - name: archivo
        type: file
        value:
          - ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
