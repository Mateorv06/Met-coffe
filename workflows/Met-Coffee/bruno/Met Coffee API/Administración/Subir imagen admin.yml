info:
  name: Subir imagen admin
  type: http
  seq: 1

http:
  method: PUT
  url: "{{baseUrl}}/api/admin/productos/{{productoId}}/imagen"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  body:
    type: multipart-form
    data:
      - name: archivo
        type: file
        value:
          - imagen-prueba.png
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('La imagen se sube con HTTP 200', () => expect(res.getStatus()).to.equal(200));
        test('El producto queda con la ruta de la imagen', () => expect((res.getBody() || {}).imagen).to.be.a('string').and.include('/uploads/productos/'));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
