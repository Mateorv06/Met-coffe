info:
  name: Consultar inventario
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/admin/inventario/{{productoId}}"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('Consultar inventario responde HTTP 200', () => expect(res.getStatus()).to.equal(200));
        test('Devuelve el stock en gramos', () => expect((res.getBody() || {}).stockGramos).to.be.a('number'));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
