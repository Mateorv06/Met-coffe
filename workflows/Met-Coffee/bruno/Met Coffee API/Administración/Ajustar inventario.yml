info:
  name: Ajustar inventario
  type: http
  seq: 7

http:
  method: PUT
  url: "{{baseUrl}}/api/admin/inventario/{{productoId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{adminToken}}
  body:
    type: json
    data: |-
      {
        "stockGramos": 5000,
        "nota": "Ajuste de pruebas"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
