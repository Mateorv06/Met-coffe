info:
  name: Ajustar inventario
  type: http
  seq: 7

http:
  method: PUT
  url: "{{baseUrl}}/api/admin/inventario/{{productoId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{adminToken}}
  body:
    type: json
    data: |-
      {
        "stockGramos": 5000,
        "nota": "Ajuste de pruebas"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('Ajustar inventario responde HTTP 200', () => expect(res.getStatus()).to.equal(200));
        test('El stock queda en 5000 g', () => expect((res.getBody() || {}).stockGramos).to.equal(5000));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
