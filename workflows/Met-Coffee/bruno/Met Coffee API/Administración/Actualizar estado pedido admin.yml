info:
  name: Actualizar estado pedido admin
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/api/admin/pedidos/{{pedidoId}}/estado"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{adminToken}}
  body:
    type: json
    data: |-
      {
        "estado": "ENVIADO"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
