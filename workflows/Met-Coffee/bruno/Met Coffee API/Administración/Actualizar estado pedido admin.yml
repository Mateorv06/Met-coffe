info:
  name: Actualizar estado pedido admin
  type: http
  seq: 5

http:
  method: PUT
  url: "{{baseUrl}}/api/admin/pedidos/{{pedidoAdminId}}/estado"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{adminToken}}
  body:
    type: json
    data: |-
      {
        "estado": "ENVIADO"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('El estado se actualiza con HTTP 200', () => expect(res.getStatus()).to.equal(200));
        test('El pedido queda en ENVIADO', () => expect((res.getBody() || {}).estado).to.eql('ENVIADO'));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
