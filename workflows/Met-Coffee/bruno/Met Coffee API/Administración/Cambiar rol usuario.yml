info:
  name: Cambiar rol usuario
  type: http
  seq: 14

http:
  method: PUT
  url: "{{baseUrl}}/api/admin/usuarios/{{usuarioDescartableId}}/rol"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{adminToken}}
  body:
    type: json
    data: |-
      {
        "rol": "ADMINISTRADOR"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('Cambiar rol responde HTTP 200', () => expect(res.getStatus()).to.equal(200));
        test('El usuario queda como ADMINISTRADOR', () => expect((res.getBody() || {}).rol).to.eql('ADMINISTRADOR'));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
