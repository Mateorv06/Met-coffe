info:
  name: Consultar usuario
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseUrl}}/api/admin/usuarios/{{usuarioId}}"
  headers:
    - name: Authorization
      value: Bearer {{adminToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
