info:
  name: Listar catálogo
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/catalogo"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('El catálogo público responde HTTP 200', () => expect(res.getStatus()).to.equal(200));
        test('El catálogo devuelve una lista JSON', () => expect(res.getBody()).to.be.an('array'));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
