info:
  name: Consultar producto
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/catalogo/{{productoId}}"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('El detalle público responde HTTP 200', () => expect(res.getStatus()).to.equal(200));
        test('El detalle corresponde al producto creado', () => expect(res.getBody().id).to.eql(bru.getEnvVar('productoId')));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
