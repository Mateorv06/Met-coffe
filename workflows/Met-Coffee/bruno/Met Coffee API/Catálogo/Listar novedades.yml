info:
  name: Listar novedades
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/catalogo/novedades"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('Las novedades responden HTTP 200', () => expect(res.getStatus()).to.equal(200));
        test('Las novedades devuelven una lista JSON', () => expect(res.getBody()).to.be.an('array'));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
