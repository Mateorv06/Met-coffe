info:
  name: Confirmar compra
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/compras/{{usuarioId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Authorization
      value: Bearer {{clienteToken}}
  body:
    type: json
    data: |-
      {
        "direccionId": "{{direccionId}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        test('La compra se confirma con HTTP 201', () => expect(res.getStatus()).to.equal(201));
        const body = res.getBody() || {};
        test('La respuesta contiene pedido, total e items', () => {
          expect(body.id).to.be.a('string').and.not.empty;
          expect(body.total).to.be.a('number').and.above(0);
          expect(body.items).to.be.an('array').that.is.not.empty;
        });
        if (res.getStatus() === 201 && body.id) {
          bru.setVar('pedidoId', body.id);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
